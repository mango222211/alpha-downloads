rsion-linux-amd64.deb', then launch Alpha AI from the app menu. For the .tar.gz, run alpha-ai in the extracted folder. Computer control, Live on-screen text reading, and OS calendar integration aren't available on Linux yet.", "installExisting": "Existing users: Quit Alpha from the menu bar or system tray before installing. There's no need to remove the old app; your sign-in and settings data are kept.", "installUpdate": "You can open the new installer from the app's update notice or from Settings → Check for updates. Updates are never installed automatically without your confirmation.", "installPermission": "If macOS screen permission is denied, check the Screen Recording permission in System Settings and restart the app.", "screenTitle": "Screen sharing and search", "screen1": "This requires OS screen permission and your consent to send your screen. During Live, the first screen and any changed screens are analyzed on Alpha's servers and count toward your plan's usage. Unchanged screens are reused, but checking details for a new question may require additional analysis. You can stop sending by ending Live or turning off Include screen content.", "screen2": "Original images are not stored in the chat database; descriptions used to answer your questions remain in the chat. The comparison cache is kept only in memory and is released when it expires or the session ends. Separate recordings you choose to save are kept. An HTTPS relay service may handle communications.", "screen3": "With Review before approval, you check the search query and provider before allowing it. Always allow is saved only after a separate confirmation and applies only to searches based on screen analysis. Search queries may contain sensitive information, so review them before approving.", "filesTitle": "Find files", "files1": "On paid and active free-trial accounts, Alpha finds files in folders you allow, shows them in Finder or File Explorer, and explains how to delete or move them. File contents and absolute paths are never sent; sending selected file names and relative locations to the AI requires your separate consent. Alpha never deletes, moves, or runs files automatically. You can revoke folder access.", "mobileTitle": "Mobile & distribution", "mobile1": "On your phone, you can chat using the mobile web. iPhone and Android installers, Dynamic Island and top notification integration, and App Store and Google Play releases aren't available yet.", "mobile2": "These are unsigned development builds. There is no official macOS distribution signing or notarization and no Windows code signing yet, and installation testing on real Windows, Intel, and Linux devices is still pending. AI chat requires a connection to the operator's server.", "footer": "This repository provides only app distribution files and usage information. Server source code and user data are not made public.", "consentTitle": "Confirm your access country", "consentBody": "To check whether Alpha is available in your region, Alpha determines your country from your IP address. The IP address itself is not stored; only if access is restricted is it kept in a form that cannot be reversed.", "consentRefused": "You need to agree to use Alpha.", "agree": "Agree", "decline": "Decline", "euBlocked": "Due to EU child protection rules (such as Article 8 of the GDPR), Alpha is unavailable for the time being."}, "zh": {"title": "下载", "intro": "下载适合你电脑的应用。本版本的变更内容请查看下方的“更新”部分。", "mine": "适合这台电脑的安装文件", "macArm": "M 系列 · macOS 13 或更高版本", "macIntel": "Intel x64 · macOS 13 或更高版本", "win": "Windows 10/11 · x64", "linuxDeb": "基于 Ubuntu/Debian 的发行版 · x64", "linuxTgz": "其他发行版 · x64 · 解压后运行", "getPkg": "下载安装程序 (.pkg)", "getExe": "下载安装程序 (.exe)", "getDeb": "下载安装文件 (.deb)", "getTgz": "下载压缩包 (.tar.gz)", "macHint": "要查看这台 Mac 的芯片，请点击屏幕左上角的苹果菜单 → “关于本机”，查看“芯片”（Apple M…）或“处理器”（Intel）。", "openWeb": "在网页版打开 Alpha", "allFiles": "版本发布与全部文件", "installGuide": "安装说明", "update": "更新", "notesLanguage": "更新说明以韩语提供。", "installTitle": "安装与更新", "installWin": "Windows：打开 Setup.exe 完成安装后，从桌面或“开始”菜单启动 Alpha AI。", "installMac": "macOS：运行 .pkg 将安装或替换 /Applications/Alpha AI.app。请从“应用程序”中打开新应用。", "installLinux": "Linux：在终端中使用 'sudo apt install ./Alpha-AI-版本-linux-amd64.deb' 安装 .deb，然后从应用菜单启动 Alpha AI。.tar.gz 请运行解压后文件夹中的 alpha-ai。Linux 版暂不支持电脑操作、Live 屏幕文字识别和系统日历同步。", "installExisting": "老用户：请先从菜单栏或系统托盘退出 Alpha 再安装。无需删除旧版应用，登录信息和设置数据都会保留。", "installUpdate": "你可以通过应用内的更新提示或 设置 → 检查更新 打开新的安装程序。未经你确认，不会自动安装。", "installPermission": "如果 macOS 屏幕权限被拒绝，请在系统设置中检查录屏权限，然后重新启动应用。", "screenTitle": "屏幕共享与搜索", "screen1": "需要操作系统的屏幕权限以及你对发送屏幕的同意。Live 期间，首个画面和发生变化的画面会在 Alpha 服务器上分析，并计入套餐用量。未变化的画面会被复用，但针对新问题确认细节时可能需要额外分析。结束 Live 或关闭“包含屏幕内容”即可停止发送。", "screen2": "原始图像不会存储在对话数据库中，用于回答问题的描述会保留在对话中。用于比较的缓存仅保存在内存中，过期或结束时即释放。你自行开启的单独录制保存会被保留。HTTPS 中继服务可能会处理通信。", "screen3": "选择“审核后批准”时，你会先确认搜索词和提供商再允许。“始终允许”需另行确认后才会保存，且仅适用于基于屏幕分析的搜索。搜索词可能包含敏感信息，批准前请务必确认。", "filesTitle": "查找文件", "files1": "付费账户及有效免费试用账户可在你允许的文件夹中查找文件，在 Finder 或文件资源管理器中显示，并说明删除或移动的方法。不会发送文件内容和绝对路径；将所选文件名和相对位置发送给 AI 需另行征得你的同意。实际的删除、移动和运行不会自动执行。文件夹权限可以撤销。", "mobileTitle": "移动端与发布说明", "mobile1": "在手机上可以使用移动网页版进行对话。iPhone 和 Android 安装包、灵动岛及顶部通知集成，以及在 App Store 和 Google Play 上架，目前尚未提供。", "mobile2": "当前为未签名的开发版本。尚无 macOS 正式发布签名与公证，也无 Windows 代码签名，Windows、Intel 和 Linux 实机安装验证仍待完成。AI 对话需要连接运营方服务器。", "footer": "此存储库仅提供应用发布文件和使用说明，不公开服务器开发源代码和用户数据。", "consentTitle": "同意确认访问国家", "consentBody": "为确认您所在地区能否使用 Alpha，我们会通过 IP 地址确认访问国家。不会保存 IP 地址原文，仅在受到使用限制时以不可还原的形式保存。", "consentRefused": "需要同意后才能使用 Alpha。", "agree": "同意", "decline": "拒绝", "euBlocked": "根据欧盟儿童保护规定（如 GDPR 第 8 条），暂时无法使用。"}, "ja": {"title": "ダウンロード", "intro": "お使いのコンピューターに合ったアプリをダウンロードしてください。今回のバージョンの変更点は、下の「アップデート」をご確認ください。", "mine": "このコンピューター用のインストールファイル", "macArm": "M シリーズ · macOS 13 以降", "macIntel": "Intel x64 · macOS 13 以降", "win": "Windows 10/11 · x64", "linuxDeb": "Ubuntu・Debian 系 · x64", "linuxTgz": "その他のディストリビューション · x64 · 展開して実行", "getPkg": "インストーラをダウンロード (.pkg)", "getExe": "インストーラをダウンロード (.exe)", "getDeb": "インストールファイルをダウンロード (.deb)", "getTgz": "圧縮ファイルをダウンロード (.tar.gz)", "macHint": "この Mac のチップを確認するには、画面左上の Apple メニュー →「この Mac について」で「チップ」（Apple M…）または「プロセッサ」（Intel）を確認してください。", "openWeb": "Web で Alpha を開く", "allFiles": "リリースと全ファイル", "installGuide": "インストール方法", "update": "アップデート", "notesLanguage": "アップデート内容は韓国語で提供されます。", "installTitle": "インストール・アップデート", "installWin": "Windows：Setup.exe を開いてインストールを完了したら、デスクトップまたはスタートメニューから Alpha AI を起動してください。", "installMac": "macOS：.pkg を実行すると /Applications/Alpha AI.app をインストール（または置き換え）します。アプリケーションフォルダから新しいアプリを起動してください。", "installLinux": "Linux：.deb はターミナルで 'sudo apt install ./Alpha-AI-バージョン-linux-amd64.deb' を実行してインストールし、アプリメニューから Alpha AI を起動してください。.tar.gz は展開したフォルダ内の alpha-ai を実行してください。Linux では、コンピューター操作・Live の画面文字読み取り・OS カレンダー連携はまだ提供されていません。", "installExisting": "既存のユーザー：メニューバーまたはシステムトレイから Alpha を終了してからインストールしてください。既存アプリの削除は不要で、ログイン情報と設定データは保持されます。", "installUpdate": "アプリのアップデート案内、または 設定 → アップデートを確認 から新しいインストーラを開けます。ユーザーの確認なしに自動でインストールされることはありません。", "installPermission": "macOS の画面の権限が拒否された場合は、システム設定で画面収録の権限を確認し、アプリを再起動してください。", "screenTitle": "画面共有と検索", "screen1": "OS の画面の権限と画面送信への同意が必要です。Live 中は、最初の画面と変化のあった画面を Alpha のサーバーで分析し、プランの利用量にカウントされます。変化のない画面は再利用しますが、新しい質問で細部を確認するには追加の分析が必要になる場合があります。Live を終了するか「画面の内容を含める」をオフにすると送信を停止できます。", "screen2": "元の画像は会話 DB に保存せず、質問に使った説明は会話に残ります。比較用キャッシュはメモリ上にのみ保持し、期限切れまたは終了時に解放します。ユーザーがオンにした別途の録画保存は保持されます。通信は HTTPS 中継サービスが処理する場合があります。", "screen3": "「確認して承認」では、検索語句と提供元を確認してから許可します。「常に許可」は別途確認したうえで保存され、画面分析に基づく検索にのみ適用されます。検索語句には機密情報が含まれる場合があるため、承認前にご確認ください。", "filesTitle": "ファイル検索", "files1": "有料アカウントと有効な無料トライアルのアカウントでは、許可したフォルダ内のファイルを探して Finder やエクスプローラーに表示し、削除・移動の方法をご案内します。ファイルの内容と絶対パスは送信せず、選択したファイル名と相対的な場所を AI に送る操作には別途同意をいただきます。実際の削除・移動・実行は自動では行いません。フォルダの権限は取り消せます。", "mobileTitle": "モバイル・配布について", "mobile1": "スマートフォンではモバイル Web で会話できます。iPhone・Android 用インストールファイル、ダイナミックアイランド・上部通知との連携、App Store・Google Play での公開はまだ提供されていません。", "mobile2": "現在は開発用の未署名ビルドです。macOS の正式配布用署名・公証と Windows のコード署名はなく、Windows・Intel・Linux 実機でのインストール検証はまだ残っています。AI との会話には運営者のサーバーへの接続が必要です。", "footer": "このリポジトリでは、アプリの配布ファイルと利用案内のみを提供しています。サーバーの開発ソースとユーザーデータは公開していません。", "consentTitle": "アクセス国の確認への同意", "consentBody": "Alpha を利用できる地域かを確認するため、IP アドレスからアクセス国を確認します。IP アドレスそのものは保存せず、利用が制限される場合のみ元に戻せない形で保管します。", "consentRefused": "Alpha を利用するには同意が必要です。", "agree": "同意する", "decline": "拒否", "euBlocked": "EU の児童保護規定（GDPR 第 8 条など）により、当面はご利用いただけません。"}, "fr": {"title": "Téléchargement", "intro": "Téléchargez l'app adaptée à votre ordinateur. Consultez la section Mise à jour ci-dessous pour connaître les nouveautés de cette version.", "mine": "Fichier d'installation pour cet ordinateur", "macArm": "Série M · macOS 13 ou version ultérieure", "macIntel": "Intel x64 · macOS 13 ou version ultérieure", "win": "Windows 10/11 · x64", "linuxDeb": "Basées sur Ubuntu/Debian · x64", "linuxTgz": "Autres distributions · x64 · Décompresser et lancer", "getPkg": "Télécharger le programme d'installation (.pkg)", "getExe": "Télécharger le programme d'installation (.exe)", "getDeb": "Télécharger le paquet (.deb)", "getTgz": "Télécharger l'archive (.tar.gz)", "macHint": "Pour connaître la puce de ce Mac, ouvrez le menu Apple en haut à gauche de l'écran → « À propos de ce Mac » et regardez « Puce » (Apple M…) ou « Processeur » (Intel).", "openWeb": "Ouvrir Alpha sur le Web", "allFiles": "Versions et tous les fichiers", "installGuide": "Guide d'installation", "update": "Mise à jour", "notesLanguage": "Les notes de mise à jour sont fournies en coréen.", "installTitle": "Installation et mise à jour", "installWin": "Windows : ouvrez Setup.exe, terminez l'installation, puis lancez Alpha AI depuis le bureau ou le menu Démarrer.", "installMac": "macOS : le .pkg installe ou remplace /Applications/Alpha AI.app. Lancez la nouvelle app depuis Applications.", "installLinux": "Linux : installez le .deb dans un terminal avec 'sudo apt install ./Alpha-AI-version-linux-amd64.deb', puis lancez Alpha AI depuis le menu des applications. Pour le .tar.gz, exécutez alpha-ai dans le dossier décompressé. Le contrôle de l'ordinateur, la lecture du texte à l'écran avec Live et l'intégration au calendrier du système ne sont pas encore disponibles sous Linux.", "installExisting": "Utilisateurs existants : quittez Alpha depuis la barre des menus ou la zone de notification avant l'installation. Inutile de supprimer l'ancienne app : vos données de connexion et vos réglages sont conservés.", "installUpdate": "Vous pouvez ouvrir le nouveau programme d'installation depuis la notification de mise à jour de l'app ou via Réglages → Rechercher des mises à jour. Rien n'est installé automatiquement sans votre confirmation.", "installPermission": "Si l'autorisation d'écran de macOS est refusée, vérifiez l'autorisation d'enregistrement de l'écran dans Réglages Système, puis relancez l'app.", "screenTitle": "Partage d'écran et recherche", "screen1": "Cela nécessite l'autorisation d'écran du système et votre accord pour l'envoi de l'écran. Pendant Live, le premier écran et les écrans modifiés sont analysés sur les serveurs d'Alpha et décomptés de l'utilisation de votre forfait. Les écrans inchangés sont réutilisés, mais vérifier des détails pour une nouvelle question peut nécessiter une analyse supplémentaire. Vous pouvez arrêter l'envoi en mettant fin à Live ou en désactivant Inclure le contenu de l'écran.", "screen2": "Les images d'origine ne sont pas enregistrées dans la base de données des conversations ; les descriptions utilisées pour répondre restent dans la conversation. Le cache de comparaison est conservé uniquement en mémoire et libéré à son expiration ou à la fin de la session. Les enregistrements que vous avez choisi de sauvegarder séparément sont conservés. Un service de relais HTTPS peut traiter les communications.", "screen3": "Avec Vérifier avant d'approuver, vous contrôlez la requête et le fournisseur avant d'autoriser la recherche. Toujours autoriser n'est enregistré qu'après une confirmation distincte et ne s'applique qu'aux recherches basées sur l'analyse de l'écran. Les requêtes peuvent contenir des informations sensibles : vérifiez-les avant d'approuver.", "filesTitle": "Recherche de fichiers", "files1": "Avec un compte payant ou un essai gratuit actif, Alpha trouve les fichiers dans les dossiers autorisés, les affiche dans le Finder ou l'Explorateur de fichiers et vous explique comment les supprimer ou les déplacer. Le contenu des fichiers et les chemins absolus ne sont jamais envoyés ; l'envoi à l'IA des noms et emplacements relatifs des fichiers sélectionnés nécessite un consentement distinct. Aucune suppression, aucun déplacement ni aucune exécution n'est effectué automatiquement. Vous pouvez révoquer l'accès aux dossiers.", "mobileTitle": "Mobile et distribution", "mobile1": "Sur téléphone, vous pouvez discuter via le Web mobile. Les fichiers d'installation iPhone et Android, l'intégration à la Dynamic Island et aux notifications en haut de l'écran, ainsi que la publication sur l'App Store et Google Play ne sont pas encore disponibles.", "mobile2": "Il s'agit de versions de développement non signées. Il n'y a pas encore de signature ni de notarisation macOS pour la distribution officielle, ni de signature de code Windows, et les tests d'installation sur de vrais appareils Windows, Intel et Linux restent à faire. Les conversations avec l'IA nécessitent une connexion au serveur de l'opérateur.", "footer": "Ce dépôt fournit uniquement les fichiers de distribution de l'app et les informations d'utilisation. Le code source du serveur et les données des utilisateurs ne sont pas publiés.", "consentTitle": "Confirmer votre pays d’accès", "consentBody": "Pour vérifier si Alpha est disponible dans votre région, Alpha détermine votre pays à partir de votre adresse IP. L’adresse IP elle-même n’est pas conservée ; elle n’est gardée sous une forme irréversible qu’en cas de restriction d’accès.", "consentRefused": "Vous devez accepter pour utiliser Alpha.", "agree": "Accepter", "decline": "Refuser", "euBlocked": "En raison des règles européennes de protection des enfants (notamment l’article 8 du RGPD), Alpha est temporairement indisponible."}, "ru": {"title": "Загрузка", "intro": "Скачайте приложение для своего компьютера. Изменения в этой версии смотрите в разделе «Обновление» ниже.", "mine": "Установщик для этого компьютера", "macArm": "Серия M · macOS 13 или новее", "macIntel": "Intel x64 · macOS 13 или новее", "win": "Windows 10/11 · x64", "linuxDeb": "На базе Ubuntu/Debian · x64", "linuxTgz": "Другие дистрибутивы · x64 · Распакуйте и запустите", "getPkg": "Скачать установщик (.pkg)", "getExe": "Скачать установщик (.exe)", "getDeb": "Скачать пакет (.deb)", "getTgz": "Скачать архив (.tar.gz)", "macHint": "Чтобы узнать чип этого Mac, откройте меню Apple в левом верхнем углу экрана → «Об этом Mac» и посмотрите пункт «Чип» (Apple M…) или «Процессор» (Intel).", "openWeb": "Открыть Alpha в браузере", "allFiles": "Релизы и все файлы", "installGuide": "Инструкция по установке", "update": "Обновление", "notesLanguage": "Описание обновлений доступно на корейском языке.", "installTitle": "Установка и обновление", "installWin": "Windows: откройте Setup.exe, завершите установку и запустите Alpha AI с рабочего стола или из меню «Пуск».", "installMac": "macOS: запуск .pkg установит или заменит /Applications/Alpha AI.app. Запустите новое приложение из папки «Программы».", "installLinux": "Linux: установите .deb в терминале командой 'sudo apt install ./Alpha-AI-версия-linux-amd64.deb', затем запустите Alpha AI из меню приложений. Для .tar.gz запустите alpha-ai в распакованной папке. Управление компьютером, чтение текста с экрана в Live и интеграция с календарём ОС на Linux пока недоступны.", "installExisting": "Текущим пользователям: перед установкой закройте Alpha через строку меню или системный трей. Удалять старое приложение не нужно, данные входа и настройки сохранятся.", "installUpdate": "Новый установщик можно открыть из уведомления об обновлении в приложении или через Настройки → Проверить обновления. Без вашего подтверждения ничего не устанавливается автоматически.", "installPermission": "Если macOS отказала в доступе к экрану, проверьте разрешение «Запись экрана» в Системных настройках и перезапустите приложение.", "screenTitle": "Демонстрация экрана и поиск", "screen1": "Требуются разрешение ОС на доступ к экрану и ваше согласие на передачу экрана. Во время Live первый кадр и изменившиеся кадры анализируются на серверах Alpha и учитываются в лимите тарифа. Неизменённые кадры используются повторно, но для уточнения деталей по новому вопросу может потребоваться дополнительный анализ. Чтобы остановить передачу, завершите Live или отключите «Включать содержимое экрана».", "screen2": "Исходные изображения не сохраняются в базе данных чатов; описания, использованные для ответа, остаются в чате. Кэш для сравнения хранится только в памяти и очищается по истечении срока или при завершении. Отдельные записи, которые вы включили сами, сохраняются. Передачу данных может обрабатывать HTTPS-ретранслятор.", "screen3": "В режиме «Проверять перед одобрением» вы видите поисковый запрос и поставщика, прежде чем разрешить поиск. «Всегда разрешать» сохраняется только после отдельного подтверждения и действует только для поиска на основе анализа экрана. Поисковые запросы могут содержать конфиденциальные данные, поэтому проверяйте их перед одобрением.", "filesTitle": "Поиск файлов", "files1": "На платных аккаунтах и при активном пробном периоде Alpha находит файлы в разрешённых папках, показывает их в Finder или Проводнике и подсказывает, как их удалить или переместить. Содержимое файлов и абсолютные пути не передаются; для отправки ИИ имён и относительного расположения выбранных файлов запрашивается отдельное согласие. Удаление, перемещение и запуск файлов автоматически не выполняются. Доступ к папкам можно отозвать.", "mobileTitle": "Мобильные устройства и распространение", "mobile1": "На телефоне можно общаться через мобильную веб-версию. Установочные файлы для iPhone и Android, интеграция с Dynamic Island и уведомлениями в верхней части экрана, а также публикация в App Store и Google Play пока недоступны.", "mobile2": "Сейчас это неподписанные сборки для разработки. Подписи и нотаризации для официального распространения в macOS, а также подписи кода Windows пока нет, проверка установки на реальных устройствах с Windows, Intel и Linux ещё не завершена. Для чата с ИИ требуется подключение к серверу оператора.", "footer": "Этот репозиторий содержит только файлы для распространения приложения и инструкции. Исходный код сервера и данные пользователей не публикуются.", "consentTitle": "Подтверждение страны доступа", "consentBody": "Чтобы проверить, доступен ли Alpha в вашем регионе, Alpha определяет страну по IP-адресу. Сам IP-адрес не сохраняется; только при ограничении доступа он хранится в необратимом виде.", "consentRefused": "Чтобы пользоваться Alpha, нужно согласие.", "agree": "Согласен", "decline": "Отклонить", "euBlocked": "Из-за правил ЕС о защите детей (например, статьи 8 GDPR) Alpha временно недоступен."}, "id": {"title": "Unduhan", "intro": "Unduh aplikasi yang sesuai dengan komputer Anda. Lihat bagian Pembaruan di bawah untuk perubahan di versi ini.", "mine": "File instalasi untuk komputer ini", "macArm": "Seri M · macOS 13 atau lebih baru", "macIntel": "Intel x64 · macOS 13 atau lebih baru", "win": "Windows 10/11 · x64", "linuxDeb": "Berbasis Ubuntu/Debian · x64", "linuxTgz": "Distribusi lainnya · x64 · Ekstrak lalu jalankan", "getPkg": "Unduh penginstal (.pkg)", "getExe": "Unduh penginstal (.exe)", "getDeb": "Unduh paket (.deb)", "getTgz": "Unduh arsip (.tar.gz)", "macHint": "Untuk memeriksa chip Mac ini, buka menu Apple di kiri atas layar → 'Tentang Mac Ini', lalu lihat 'Chip' (Apple M…) atau 'Prosesor' (Intel).", "openWeb": "Buka Alpha di web", "allFiles": "Rilis dan semua file", "installGuide": "Panduan instalasi", "update": "Pembaruan", "notesLanguage": "Catatan pembaruan tersedia dalam bahasa Korea.", "installTitle": "Instalasi & pembaruan", "installWin": "Windows: Buka Setup.exe, selesaikan instalasi, lalu jalankan Alpha AI dari desktop atau menu Start.", "installMac": "macOS: Menjalankan .pkg akan memasang atau mengganti /Applications/Alpha AI.app. Jalankan aplikasi baru dari folder Aplikasi.", "installLinux": "Linux: Pasang .deb lewat terminal dengan 'sudo apt install ./Alpha-AI-versi-linux-amd64.deb', lalu jalankan Alpha AI dari menu aplikasi. Untuk .tar.gz, jalankan alpha-ai di folder hasil ekstrak. Kontrol komputer, pembacaan teks layar Live, dan integrasi kalender OS belum tersedia di Linux.", "installExisting": "Pengguna lama: Keluar dari Alpha lewat bilah menu atau system tray sebelum memasang. Tidak perlu menghapus aplikasi lama; data login dan pengaturan tetap tersimpan.", "installUpdate": "Anda bisa membuka penginstal baru dari pemberitahuan pembaruan di aplikasi atau dari Pengaturan → Periksa pembaruan. Pembaruan tidak akan dipasang otomatis tanpa konfirmasi Anda.", "installPermission": "Jika izin layar macOS ditolak, periksa izin Perekaman Layar di Pengaturan Sistem, lalu jalankan ulang aplikasi.", "screenTitle": "Berbagi layar dan pencarian", "screen1": "Diperlukan izin layar dari sistem operasi dan persetujuan Anda untuk mengirim layar. Selama Live, layar pertama dan layar yang berubah dianalisis di server Alpha dan dihitung dalam kuota paket Anda. Layar yang tidak berubah digunakan kembali, tetapi memeriksa detail untuk pertanyaan baru mungkin memerlukan analisis tambahan. Anda bisa menghentikan pengiriman dengan mengakhiri Live atau menonaktifkan Sertakan konten layar.", "screen2": "Gambar asli tidak disimpan di database percakapan; deskripsi yang dipakai untuk menjawab pertanyaan tetap ada di percakapan. Cache perbandingan hanya disimpan di memori dan dihapus saat kedaluwarsa atau sesi berakhir. Rekaman terpisah yang Anda aktifkan sendiri tetap disimpan. Layanan relai HTTPS dapat menangani komunikasi.", "screen3": "Dengan Tinjau sebelum menyetujui, Anda memeriksa kata kunci pencarian dan penyedianya sebelum mengizinkan. Selalu izinkan baru disimpan setelah konfirmasi terpisah dan hanya berlaku untuk pencarian berdasarkan analisis layar. Kata kunci pencarian bisa memuat informasi sensitif, jadi periksa sebelum menyetujui.", "filesTitle": "Cari file", "files1": "Di akun berbayar dan akun uji coba gratis yang aktif, Alpha mencari file di folder yang Anda izinkan, menampilkannya di Finder atau File Explorer, dan menjelaskan cara menghapus atau memindahkannya. Isi file dan jalur absolut tidak dikirim; mengirim nama dan lokasi relatif file yang dipilih ke AI memerlukan persetujuan terpisah. Penghapusan, pemindahan, dan menjalankan file tidak dilakukan secara otomatis. Izin folder dapat dicabut.", "mobileTitle": "Seluler & distribusi", "mobile1": "Di ponsel, Anda bisa mengobrol lewat web seluler. File instalasi iPhone dan Android, integrasi Dynamic Island dan notifikasi atas, serta rilis di App Store dan Google Play belum tersedia.", "mobile2": "Saat ini masih berupa build pengembangan tanpa tanda tangan. Belum ada penandatanganan dan notarisasi resmi macOS maupun penandatanganan kode Windows, dan verifikasi instalasi di perangkat Windows, Intel, dan Linux sungguhan belum selesai. Obrolan AI memerlukan koneksi ke server operator.", "footer": "Repositori ini hanya menyediakan file distribusi aplikasi dan panduan penggunaan. Kode sumber server dan data pengguna tidak dipublikasikan.", "consentTitle": "Persetujuan pemeriksaan negara akses", "consentBody": "Untuk memeriksa apakah Alpha tersedia di wilayah Anda, Alpha menentukan negara Anda dari alamat IP. Alamat IP itu sendiri tidak disimpan; hanya jika akses dibatasi, alamat disimpan dalam bentuk yang tidak dapat dikembalikan.", "consentRefused": "Anda perlu menyetujui untuk menggunakan Alpha.", "agree": "Setuju", "decline": "Tolak", "euBlocked": "Karena aturan perlindungan anak Uni Eropa (seperti Pasal 8 GDPR), Alpha untuk sementara tidak dapat digunakan."}, "de": {"title": "Download", "intro": "Laden Sie die passende App für Ihren Computer herunter. Die Änderungen dieser Version finden Sie unten im Abschnitt „Update“.", "mine": "Installationsdatei für diesen Computer", "macArm": "M-Serie · macOS 13 oder neuer", "macIntel": "Intel x64 · macOS 13 oder neuer", "win": "Windows 10/11 · x64", "linuxDeb": "Ubuntu-/Debian-basiert · x64", "linuxTgz": "Andere Distributionen · x64 · Entpacken und ausführen", "getPkg": "Installationsprogramm herunterladen (.pkg)", "getExe": "Installationsprogramm herunterladen (.exe)", "getDeb": "Paket herunterladen (.deb)", "getTgz": "Archiv herunterladen (.tar.gz)", "macHint": "Um den Chip dieses Mac zu prüfen, öffnen Sie oben links das Apple-Menü → „Über diesen Mac“ und sehen Sie unter „Chip“ (Apple M…) oder „Prozessor“ (Intel) nach.", "openWeb": "Alpha im Web öffnen", "allFiles": "Releases und alle Dateien", "installGuide": "Installationsanleitung", "update": "Update", "notesLanguage": "Die Update-Hinweise sind auf Koreanisch verfügbar.", "installTitle": "Installation & Update", "installWin": "Windows: Öffnen Sie Setup.exe, schließen Sie die Installation ab und starten Sie Alpha AI über den Desktop oder das Startmenü.", "installMac": "macOS: Das .pkg installiert oder ersetzt /Applications/Alpha AI.app. Starten Sie die neue App über den Ordner „Programme“.", "installLinux": "Linux: Installieren Sie die .deb im Terminal mit 'sudo apt install ./Alpha-AI-Version-linux-amd64.deb' und starten Sie Alpha AI über das App-Menü. Bei .tar.gz führen Sie alpha-ai im entpackten Ordner aus. Computersteuerung, das Lesen von Bildschirmtext mit Live und die Integration des Systemkalenders sind unter Linux noch nicht verfügbar.", "installExisting": "Bestehende Nutzer: Beenden Sie Alpha vor der Installation über die Menüleiste oder den Infobereich. Die alte App muss nicht gelöscht werden; Anmelde- und Einstellungsdaten bleiben erhalten.", "installUpdate": "Das neue Installationsprogramm können Sie über den Update-Hinweis der App oder unter Einstellungen → Nach Updates suchen öffnen. Ohne Ihre Bestätigung wird nichts automatisch installiert.", "installPermission": "Wird die Bildschirmberechtigung von macOS verweigert, prüfen Sie in den Systemeinstellungen die Berechtigung für die Bildschirmaufnahme und starten Sie die App neu.", "screenTitle": "Bildschirmfreigabe und Suche", "screen1": "Erforderlich sind die Bildschirmberechtigung des Betriebssystems und Ihre Zustimmung zur Bildschirmübertragung. Während Live werden der erste Bildschirm und geänderte Bildschirme auf den Servern von Alpha analysiert und auf das Nutzungskontingent Ihres Tarifs angerechnet. Unveränderte Bildschirme werden wiederverwendet, für Details zu einer neuen Frage kann jedoch eine zusätzliche Analyse nötig sein. Sie können die Übertragung stoppen, indem Sie Live beenden oder „Bildschirminhalt einbeziehen“ ausschalten.", "screen2": "Originalbilder werden nicht in der Chat-Datenbank gespeichert; die zur Beantwortung verwendeten Beschreibungen bleiben im Chat. Der Vergleichscache wird nur im Arbeitsspeicher gehalten und bei Ablauf oder Beenden freigegeben. Separate Aufzeichnungen, die Sie selbst aktiviert haben, bleiben erhalten. Die Kommunikation kann über einen HTTPS-Relay-Dienst abgewickelt werden.", "screen3": "Bei „Vor Freigabe prüfen“ kontrollieren Sie Suchbegriff und Anbieter, bevor Sie die Suche erlauben. „Immer erlauben“ wird erst nach einer separaten Bestätigung gespeichert und gilt nur für Suchen auf Basis der Bildschirmanalyse. Suchbegriffe können sensible Informationen enthalten. Prüfen Sie sie daher vor der Freigabe.", "filesTitle": "Dateien finden", "files1": "Bei kostenpflichtigen Konten und aktiven Testzeiträumen findet Alpha Dateien in den von Ihnen freigegebenen Ordnern, zeigt sie im Finder oder Explorer an und erklärt, wie Sie sie löschen oder verschieben. Dateiinhalte und absolute Pfade werden nicht übertragen; für das Senden ausgewählter Dateinamen und relativer Speicherorte an die KI wird Ihre gesonderte Zustimmung eingeholt. Löschen, Verschieben und Ausführen erfolgen nie automatisch. Ordnerberechtigungen können Sie widerrufen.", "mobileTitle": "Mobil & Bereitstellung", "mobile1": "Auf dem Smartphone können Sie über das mobile Web chatten. Installationsdateien für iPhone und Android, die Integration mit der Dynamic Island und Benachrichtigungen am oberen Bildschirmrand sowie Veröffentlichungen im App Store und bei Google Play sind noch nicht verfügbar.", "mobile2": "Es handelt sich um unsignierte Entwicklungs-Builds. Eine offizielle macOS-Signierung und Notarisierung sowie eine Windows-Codesignatur fehlen noch, und Installationstests auf echten Windows-, Intel- und Linux-Geräten stehen noch aus. Für KI-Chats ist eine Verbindung zum Server des Betreibers erforderlich.", "footer": "Dieses Repository enthält nur die App-Installationsdateien und Nutzungshinweise. Server-Quellcode und Nutzerdaten werden nicht veröffentlicht.", "consentTitle": "Zugangsland bestätigen", "consentBody": "Um zu prüfen, ob Alpha in Ihrer Region verfügbar ist, ermittelt Alpha Ihr Land anhand Ihrer IP-Adresse. Die IP-Adresse selbst wird nicht gespeichert; nur bei einer Zugangssperre wird sie in nicht umkehrbarer Form aufbewahrt.", "consentRefused": "Sie müssen zustimmen, um Alpha zu nutzen.", "agree": "Zustimmen", "decline": "Ablehnen", "euBlocked": "Aufgrund der EU-Kinderschutzvorschriften (u. a. Art. 8 DSGVO) ist Alpha vorübergehend nicht verfügbar."}, "pt-BR": {"title": "Download", "intro": "Baixe o app certo para o seu computador. Veja as novidades desta versão na seção Atualização abaixo.", "mine": "Instalador para este computador", "macArm": "Série M · macOS 13 ou posterior", "macIntel": "Intel x64 · macOS 13 ou posterior", "win": "Windows 10/11 · x64", "linuxDeb": "Baseadas em Ubuntu/Debian · x64", "linuxTgz": "Outras distribuições · x64 · Extraia e execute", "getPkg": "Baixar instalador (.pkg)", "getExe": "Baixar instalador (.exe)", "getDeb": "Baixar pacote (.deb)", "getTgz": "Baixar arquivo compactado (.tar.gz)", "macHint": "Para ver o chip deste Mac, abra o menu Apple no canto superior esquerdo da tela → “Sobre Este Mac” e veja “Chip” (Apple M…) ou “Processador” (Intel).", "openWeb": "Abrir o Alpha na web", "allFiles": "Versões e todos os arquivos", "installGuide": "Guia de instalação", "update": "Atualização", "notesLanguage": "As notas de atualização estão disponíveis em coreano.", "installTitle": "Instalação e atualização", "installWin": "Windows: abra o Setup.exe, conclua a instalação e abra o Alpha AI pela área de trabalho ou pelo menu Iniciar.", "installMac": "macOS: ao executar o .pkg, /Applications/Alpha AI.app é instalado ou substituído. Abra o novo app pela pasta Aplicativos.", "installLinux": "Linux: instale o .deb no terminal com 'sudo apt install ./Alpha-AI-versão-linux-amd64.deb' e abra o Alpha AI pelo menu de aplicativos. Para o .tar.gz, execute alpha-ai na pasta extraída. Controle do computador, leitura de texto da tela no Live e integração com o calendário do sistema ainda não estão disponíveis no Linux.", "installExisting": "Usuários atuais: feche o Alpha pela barra de menus ou pela bandeja do sistema antes de instalar. Não é preciso remover o app antigo; seus dados de login e configurações são mantidos.", "installUpdate": "Você pode abrir o novo instalador pelo aviso de atualização do app ou em Configurações → Verificar atualizações. Nada é instalado automaticamente sem a sua confirmação.", "installPermission": "Se a permissão de tela do macOS for negada, verifique a permissão de Gravação de Tela nos Ajustes do Sistema e abra o app novamente.", "screenTitle": "Compartilhamento de tela e busca", "screen1": "É necessário ter a permissão de tela do sistema operacional e o seu consentimento para enviar a tela. Durante o Live, a primeira tela e as telas que mudarem são analisadas nos servidores do Alpha e contam no uso do seu plano. Telas sem alteração são reutilizadas, mas verificar detalhes para uma nova pergunta pode exigir análise adicional. Você pode parar o envio encerrando o Live ou desativando Incluir conteúdo da tela.", "screen2": "As imagens originais não são salvas no banco de dados das conversas; as descrições usadas nas respostas ficam na conversa. O cache de comparação fica só na memória e é liberado ao expirar ou ao encerrar. Gravações separadas que você ativar são mantidas. Um serviço de retransmissão HTTPS pode processar a comunicação.", "screen3": "Em Revisar antes de aprovar, você confere o termo de busca e o provedor antes de permitir. Sempre permitir só é salvo após uma confirmação separada e vale apenas para buscas baseadas na análise de tela. Os termos de busca podem conter informações sensíveis, então confira antes de aprovar.", "filesTitle": "Encontrar arquivos", "files1": "Em contas pagas e com teste grátis ativo, o Alpha encontra arquivos nas pastas que você permitir, mostra-os no Finder ou no Explorador de Arquivos e explica como excluí-los ou movê-los. O conteúdo dos arquivos e os caminhos absolutos não são enviados; enviar à IA os nomes e locais relativos dos arquivos selecionados exige um consentimento separado. Exclusão, movimentação e execução nunca são feitas automaticamente. Você pode revogar a permissão das pastas.", "mobileTitle": "Celular e distribuição", "mobile1": "No celular, você pode conversar pela web móvel. Instaladores para iPhone e Android, integração com a Dynamic Island e as notificações no topo da tela e o lançamento na App Store e no Google Play ainda não estão disponíveis.", "mobile2": "Estas são builds de desenvolvimento sem assinatura. Ainda não há assinatura e notarização oficiais para distribuição no macOS nem assinatura de código no Windows, e os testes de instalação em dispositivos reais com Windows, Intel e Linux ainda estão pendentes. As conversas com a IA exigem conexão com o servidor do operador.", "footer": "Este repositório oferece apenas os arquivos de distribuição do app e as instruções de uso. O código-fonte do servidor e os dados dos usuários não são publicados.", "consentTitle": "Confirmar país de acesso", "consentBody": "Para verificar se o Alpha está disponível na sua região, o Alpha identifica seu país pelo endereço IP. O endereço IP em si não é armazenado; somente se o acesso for restrito ele é guardado de forma irreversível.", "consentRefused": "Você precisa concordar para usar o Alpha.", "agree": "Concordo", "decline": "Recusar", "euBlocked": "Devido às regras de proteção infantil da UE (como o artigo 8 do GDPR), o Alpha está temporariamente indisponível."}, "es-MX": {"title": "Descargas", "intro": "Descarga la app adecuada para tu computadora. Consulta la sección Actualización abajo para ver los cambios de esta versión.", "mine": "Instalador para esta computadora", "macArm": "Serie M · macOS 13 o posterior", "macIntel": "Intel x64 · macOS 13 o posterior", "win": "Windows 10/11 · x64", "linuxDeb": "Basadas en Ubuntu/Debian · x64", "linuxTgz": "Otras distribuciones · x64 · Descomprime y ejecuta", "getPkg": "Descargar instalador (.pkg)", "getExe": "Descargar instalador (.exe)", "getDeb": "Descargar paquete (.deb)", "getTgz": "Descargar archivo comprimido (.tar.gz)", "macHint": "Para ver el chip de esta Mac, abre el menú Apple en la esquina superior izquierda de la pantalla → “Acerca de esta Mac” y busca “Chip” (Apple M…) o “Procesador” (Intel).", "openWeb": "Abrir Alpha en la web", "allFiles": "Versiones y todos los archivos", "installGuide": "Guía de instalación", "update": "Actualización", "notesLanguage": "Las notas de actualización están disponibles en coreano.", "installTitle": "Instalación y actualización", "installWin": "Windows: abre Setup.exe, completa la instalación y luego abre Alpha AI desde el escritorio o el menú Inicio.", "installMac": "macOS: al ejecutar el .pkg se instala o reemplaza /Applications/Alpha AI.app. Abre la nueva app desde Aplicaciones.", "installLinux": "Linux: instala el .deb desde una terminal con 'su alla. Los términos de búsqueda pueden incluir información sensible, así que revísalos antes de aprobar.", "filesTitle": "Buscar archivos", "files1": "En cuentas de pago y con prueba gratis activa, Alpha busca archivos en las carpetas que permitas, los muestra en Finder o el Explorador de archivos y te explica cómo eliminarlos o moverlos. El contenido de los archivos y las rutas absolutas no se envían; enviar a la IA los nombres y ubicaciones relativas de los archivos seleccionados requiere un consentimiento aparte. Nunca se eliminan, mueven ni ejecutan archivos automáticamente. Puedes revocar el permiso de las carpetas.", "mobileTitle": "Móvil y distribución", "mobile1": "En el celular puedes chatear desde la web móvil. Los instaladores para iPhone y Android, la integración con la Dynamic Island y las notificaciones en la parte superior, y el lanzamiento en App Store y Google Play aún no están disponibles.", "mobile2": "Por ahora son compilaciones de desarrollo sin firmar. Aún no hay firma ni notarización oficial para distribución en macOS ni firma de código en Windows, y siguen pendientes las pruebas de instalación en equipos reales con Windows, Intel y Linux. El chat con IA requiere conexión al servidor del operador.", "footer": "Este repositorio solo ofrece los archivos de distribución de la app y la información de uso. El código fuente del servidor y los datos de los usuarios no se publican.", "consentTitle": "Confirmar país de acceso", "consentBody": "Para comprobar si Alpha está disponible en tu región, Alpha determina tu país a partir de tu dirección IP. La dirección IP en sí no se guarda; solo si se restringe el acceso se conserva de forma irreversible.", "consentRefused": "Debes aceptar para usar Alpha.", "agree": "Acepto", "decline": "Rechazar", "euBlocked": "Debido a las normas de la UE sobre protección de menores (como el artículo 8 del RGPD), Alpha no está disponible por el momento."}};
const LANGS=[['ko','한국어'],['en','English'],['zh','中文'],['ja','日本語'],['fr','Français'],['ru','Русский'],['id','Bahasa Indonesia'],['de','Deutsch'],['pt-BR','Português (Brasil)'],['es-MX','Español (México)']];
const UI=LANGS.map(l=>l[0]);
const store={get(k){try{return localStorage.getItem(k);}catch{return null;}},set(k,v){try{localStorage.setItem(k,v);}catch{}}};
// 첫 방문: 브라우저 언어 → 10개 중 가장 가까운 것, 없으면 영어(사용자 결정 2026-10-20). ?lang= 이나 직접 고른 언어가 먼저.
function browserLanguage(){for(const raw of navigator.languages||[navigator.language||'']){const l=String(raw||'').toLowerCase();if(!l)continue;if(l.startsWith('pt'))return 'pt-BR';if(l.startsWith('es'))return 'es-MX';if(l.startsWith('in'))return 'id';const b=l.split(/[-_]/)[0];if(UI.includes(b))return b;}return 'en';}
let lang=new URLSearchParams(location.search).get('lang');if(!UI.includes(lang))lang=store.get('alpha.downloads.lang');if(!UI.includes(lang))lang=browserLanguage();
const T=key=>(I18N[lang]&&I18N[lang][key])||(I18N.en&&I18N.en[key])||I18N.ko[key]||'';
function apply(){
 document.documentElement.lang=lang;document.title='Alpha AI · '+T('title');
 for(const el of document.querySelectorAll('[data-t]'))el.textContent=T(el.dataset.t);
 const notes=document.querySelector('[data-t="notesLanguage"]');if(notes)notes.hidden=lang==='ko';
 renderHint();if(gate)gate.render();
}
const select=document.getElementById('lang');select.innerHTML=LANGS.map(([c,n])=>'<option value="'+c+'">'+n+'</option>').join('');select.value=lang;
select.onchange=()=>{lang=select.value;store.set('alpha.downloads.lang',lang);apply();};
// 이 기기 찾기: 맞는 설치 파일을 맨 앞에 두고 테두리를 빛나게 한다(사용자 요청 2026-10-20).
let macUnsure=false;
async function detect(){
 const ua=navigator.userAgent||'',platform=(navigator.userAgentData&&navigator.userAgentData.platform)||navigator.platform||'';
 if(/android|iphone|ipad|ipod/i.test(ua))return [];
 if(/win/i.test(platform)||/Windows/.test(ua))return ['win'];
 if(/linux|x11|cros/i.test(platform)||/Linux|X11/.test(ua))return ['linux-deb','linux-tgz'];
 if(/mac/i.test(platform)||/Macintosh/.test(ua)){
  try{if(navigator.userAgentData&&navigator.userAgentData.getHighEntropyValues){const v=await navigator.userAgentData.getHighEntropyValues(['architecture']);if(v.architecture==='arm')return ['mac-arm64'];if(v.architecture==='x86')return ['mac-x64'];}}catch{}
  try{const gl=document.createElement('canvas').getContext('webgl');const ext=gl&&gl.getExtension('WEBGL_debug_renderer_info');const r=ext?String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)):'';
   if(/Apple M\d/i.test(r))return ['mac-arm64'];if(/Intel|AMD|Radeon|NVIDIA/i.test(r))return ['mac-x64'];}catch{}
  macUnsure=true;return ['mac-arm64','mac-x64'];   // 구분이 안 되면 Mac 두 개 모두 앞에·빛내기(사용자 결정 2026-10-20)
 }
 return [];
}
function renderHint(){const h=document.getElementById('hint');if(!h)return;h.hidden=!macUnsure;h.textContent=macUnsure?T('macHint'):'';}
// 첫 방문 필수 동의: IP 로 접속 국가 확인 → EU 27개국이면 내려받기 대신 그 나라 언어 문구(사용자 결정 2026-10-20).
let gate=null;
function showBlocked(message){document.getElementById('content').innerHTML='<p class="blocked"></p>';document.querySelector('.blocked').textContent=message;}
async function geo(){
 try{const r=await fetch('https://alphaaiweb.com/api/geo',{cache:'no-store'});const d=await r.json();if(d.restricted)showBlocked((d.text&&d.text[5])||T('euBlocked'));}catch{}   // 서버에 닿지 않으면 그대로 둔다
}
function consent(){
 if(store.get('osassistant.geoConsent')==='1'){geo();return;}
 const box=document.createElement('div');box.className='gate';box.innerHTML='<div class="gate-card"><h2></h2><p></p><div class="gate-actions"><button type="button" class="decline"></button><button type="button" class="primary agree"></button></div></div>';
 document.body.append(box);let declined=false;
 gate={render(){box.querySelector('h2').textContent=T('consentTitle');box.querySelector('p').textContent=declined?T('consentRefused'):T('consentBody');box.querySelector('.decline').textContent=T('decline');box.querySelector('.agree').textContent=T('agree');}};
 box.querySelector('.decline').onclick=()=>{declined=true;gate.render();};
 box.querySelector('.agree').onclick=()=>{store.set('osassistant.geoConsent','1');box.remove();gate=null;geo();};
 gate.render();
}
detect().then(mine=>{const list=document.getElementById('downloads');if(!list)return;for(const os of mine.slice().reverse()){const card=list.querySelector('[data-os="'+os+'"]');if(card){card.classList.add('mine');list.prepend(card);}}renderHint();});
consent();apply();
})();
</script></body></html>
